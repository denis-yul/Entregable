<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de inicio</title>
    <link rel="stylesheet" href="assets/css/inicio.css">
</head>
<body>
      <!-- PANTALLA 2: Panel de inicio -->
  <section class="pantalla-panel" id="panel">

    <!-- Franja superior con el botón de la esquina -->
    <header class="cabecera-panel">
      <!-- Botón de la esquina (cierra la sesión) -->
      <button class="boton-esquina" type="button" aria-label="Cerrar sesión"></button>
    </header>

    <!-- Tarjeta: Trabajadores -->
    <article class="tarjeta-trabajadores">
      <img class="as" src="" alt="">
      <span class="texto-trabajadores">Trabajadores</span>
    </article>

    <!-- Tarjeta: Tardanzas -->
    <article class="tarjeta-tardanzas">
      <img class="icono-tardanzas" src="assets/icons/Clock.png" alt="">
      <span class="texto-tardanzas">Tardanzas</span>
    </article>

    <!-- Tarjeta: Presentes -->
    <article class="tarjeta-presentes">
      <img class="icono-presentes" src="assets/icons/Check Mark.png" alt="">
      <span class="texto-presentes">Presentes</span>
    </article>

    <!-- Tarjeta: Faltaron -->
    <article class="tarjeta-faltaron">
      <img class="icono-faltaron" src="assets/icons/cancel.svg" alt="">
      <span class="texto-faltaron">Faltaron</span>
    </article>

    <!-- Barra ancha para marcar asistencia con el rostro -->
    <a class="barra-seleccion" href="bashboard.html">
      <a class="barra-seleccion" href="bashboard.html">
      <span class="texto-marcar">Marcar asistencia</span>
      <small class="subtexto-marcar">Rápido</small>
      <span class="flecha-barra" aria-hidden="true">›</span>
    </a>

    <!-- Barra de navegación inferior -->
    <nav class="barra-navegacion">
      <!-- Enlace: Inicio -->
      <a class="enlace-inicio" href="inicio.html" aria-current="page">
        <a class="enlace-inicio" href="inicio.html" aria-current="page">
        <span class="nombre-inicio">Inicio</span>
      </a>
      <!-- Enlace: Trabajadores -->
      <a class="enlace-trabajadores" href="#">
        <img class="icono-personas" src="assets/icons/user.png" alt="">
        <span class="nombre-personas">Trabajadores</span>
      </a>
      <!-- Enlace: Asistencia -->
      <a class="enlace-asistencia" href="asistencia.html">
        <img class="icono-reloj" src="assets/icons/Time.png" alt="">
        <span class="nombre-asistencia">Asistencia</span>
      </a>
    </nav>
  </section>

  <section id="pantalla-inicio" hidden>
    <button id="ir-dashboard">Ir al Dashboard</button>
</section>
<script src="assets/js/mein.js"></script>
</body>
</html>
